<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  --shadow-lg: 0 2px 8px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.3);

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

/* Transitions */
*, *::before, *::after {
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
}

const IconX = ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.6} strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>;

// ─── Data ─────────────────────────────────────────────────────────────────
const TASKS_INIT = {
  deep_work: [
    { id: 1, title: 'Finish Q2 roadmap document', tags: ['planning', 'strategy'], done: false },
    { id: 2, title: 'Review architecture proposal for auth service', tags: ['backend'], done: false },
    { id: 3, title: 'Write RFC for new API versioning', tags: ['backend', 'api'], done: true },
  ],
  short_task: [
    { id: 4, title: 'Reply to design team feedback', tags: [], done: true },

  ],

    { id: 7, title: 'Update dependencies in frontend', tags: ['dev'], done: false },
    { id: 8, title: 'Clear inbox and triage issues', tags: [], done: true },

};

const COLS = [
  { key: 'deep_work',  label: 'Deep Work',    color: 'var(--deep)',  bg: 'var(--deep-light)' },
  { key: 'short_task', label: 'Short Tasks',   color: 'var(--short)', bg: 'var(--short-light)' },
  { key: 'maintenance',label: 'Maintenance',   color: 'var(--maint)', bg: 'var(--maint-light)' },
];

const CAL_DAYS = ['Mo','Tu','We','Th','Fr','Sa','Su'];
const today = new Date(2026, 3, 20); // April 20 2026

// ─── Mini calendar heatmap data ───────────────────────────────────────────
const heatmap = {};
for (let d = 1; d <= 30; d++) {
  const r = Math.random();
  heatmap[`2026-04-${String(d).padStart(2,'0')}`] = d > 20 ? null : r < 0.2 ? 0 : r < 0.5 ? 0.5 : r < 0.8 ? 0.8 : 1;
}

// ─── TaskCard ─────────────────────────────────────────────────────────────
function TaskCard({ task, onToggle, onDelete, density }) {
  const [hovered, setHovered] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const compact = density === 'compact';

  return (
    <div
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => { setHovered(false); setConfirmDelete(false); }}
      style={{
        display: 'flex', alignItems: 'flex-start', gap: 10,
        padding: compact ? '8px 10px' : '10px 12px',
        borderRadius: 'var(--radius-sm)',
        background: task.done ? 'transparent' : 'var(--surface)',
        boxShadow: task.done ? 'none' : hovered ? 'var(--shadow)' : '0 1px 2px rgba(0,0,0,0.04)',
        border: `1px solid ${task.done ? 'transparent' : 'var(--border)'}`,
        opacity: task.done ? 0.45 : 1,
        transform: hovered && !task.done ? 'translateY(-1px)' : 'none',
        cursor: 'default',
        userSelect: 'none',
      }}
    >
      {/* Drag handle */}
      <div style={{ color: 'var(--text3)', paddingTop: 2, opacity: hovered ? 1 : 0, flexShrink: 0, cursor: 'grab' }}>
        <IconGrip size={12} />
      </div>

      {/* Checkbox */}
      <button
        onClick={() => onToggle(task.id)}
        style={{
          width: 18, height: 18, borderRadius: '50%', flexShrink: 0, marginTop: 1,
          border: task.done ? 'none' : '1.5px solid var(--border2)',
          background: task.done ? 'var(--success)' : hovered ? 'var(--accent-light)' : 'transparent',
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}
      >
        {task.done && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>}
      </button>

      {/* Content */}
      <div style={{ flex: 1, minWidth: 0 }}>
        <p style={{
          fontSize: 13.5, fontWeight: 500, color: 'var(--text)',
          textDecoration: task.done ? 'line-through' : 'none',
          lineHeight: 1.4, textWrap: 'pretty',
        }}>{task.title}</p>
        {task.tags.length > 0 && (
          <div style={{ display: 'flex', gap: 4, marginTop: 5, flexWrap: 'wrap' }}>
            {task.tags.map(t => (
              <span key={t} style={{
                fontSize: 11, fontFamily: 'var(--mono)', fontWeight: 500,
                color: 'var(--text3)', background: 'var(--border)',
                padding: '1px 6px', borderRadius: 3,
              }}>#{t}</span>
            ))}
          </div>
        )}
      </div>

      {/* Actions */}
      <div style={{ display: 'flex', gap: 2, opacity: hovered ? 1 : 0, flexShrink: 0 }}>
        <ActionBtn icon={<IconPencil size={13}/>} title="Edit" />
        <ActionBtn icon={<IconClock size={13}/>} title="Remind" color="var(--accent)" />
        {confirmDelete ? (
          <button onClick={() => onDelete(task.id)} title="Confirm delete" style={{
            width: 24, height: 24, borderRadius: 4, border: 'none',
            background: '#fee2e2', color: '#dc2626', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600,
          }}>✕</button>
        ) : (
          <ActionBtn icon={<IconTrash size={13}/>} title="Delete" color="#dc2626" onClick={() => setConfirmDelete(true)} />
        )}
      </div>
    </div>
  );
}

function ActionBtn({ icon, title, color, onClick }) {
  const [h, setH] = useState(false);
  return (
    <button
      title={title} onClick={onClick}
      onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{
        width: 24, height: 24, borderRadius: 4, border: 'none',
        background: h ? 'var(--border)' : 'transparent',
        color: h && color ? color : 'var(--text3)',
        cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}
    >{icon}</button>
  );
}

// ─── TaskColumn ───────────────────────────────────────────────────────────
function TaskColumn({ col, tasks, onToggle, onDelete, onAdd, density }) {
  const [adding, setAdding] = useState(false);
  const [newTitle, setNewTitle] = useState('');
  const colTasks = tasks[col.key];
  const done = colTasks.filter(t => t.done).length;
  const pct = colTasks.length ? done / colTasks.length : 0;
  const compact = density === 'compact';

  function handleAdd() {
    if (newTitle.trim()) { onAdd(col.key, newTitle.trim()); setNewTitle(''); setAdding(false); }
  }

  return (
    <div style={{
      flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column',
      background: 'var(--surface)', borderRadius: 12,
      border: '1px solid var(--border)', boxShadow: 'var(--shadow)',
      overflow: 'hidden',
    }}>
      {/* Colored accent bar */}
      <div style={{ height: 3, background: col.color, borderRadius: '12px 12px 0 0' }} />

      {/* Header */}
      <div style={{ padding: compact ? '12px 14px 10px' : '14px 16px 12px', borderBottom: '1px solid var(--border)' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: col.color }}>{col.label}</span>
          <span style={{ fontSize: 12, fontFamily: 'var(--mono)', color: 'var(--text3)', fontWeight: 500 }}>{done}/{colTasks.length}</span>
        </div>
        {/* Progress bar */}
        <div style={{ height: 3, background: 'var(--border)', borderRadius: 2, overflow: 'hidden' }}>
          <div style={{ height: '100%', width: `${pct * 100}%`, background: col.color, borderRadius: 2, transition: 'width 0.4s ease' }} />
        </div>
      </div>

      {/* Tasks */}
      <div style={{ flex: 1, overflowY: 'auto', padding: compact ? '8px' : '10px', display: 'flex', flexDirection: 'column', gap: compact ? 4 : 6 }}>
        {colTasks.map(t => (
          <TaskCard key={t.id} task={t} onToggle={onToggle} onDelete={onDelete} density={density} />
        ))}

        {/* Add task inline */}
        {adding ? (
          <div style={{ display: 'flex', gap: 6, padding: '8px 10px', background: 'var(--surface)', border: '1px solid var(--border2)', borderRadius: 'var(--radius-sm)' }}>
            <input
              autoFocus value={newTitle}
              onChange={e => setNewTitle(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') handleAdd(); if (e.key === 'Escape') { setAdding(false); setNewTitle(''); } }}
              placeholder="Task title…"
              style={{ flex: 1, border: 'none', outline: 'none', fontSize: 13.5, background: 'transparent', color: 'var(--text)', fontFamily: 'inherit' }}
            />
            <button onClick={handleAdd} style={{ fontSize: 12, fontWeight: 600, color: 'white', background: col.color, border: 'none', borderRadius: 4, padding: '3px 10px', cursor: 'pointer' }}>Add</button>
            <button onClick={() => { setAdding(false); setNewTitle(''); }} style={{ fontSize: 12, color: 'var(--text3)', background: 'none', border: 'none', cursor: 'pointer' }}><IconX size={13}/></button>
          </div>
        ) : (
          <button
            onClick={() => setAdding(true)}
            style={{
              width: '100%', padding: '7px 10px', border: '1px dashed var(--border2)',
              borderRadius: 'var(--radius-sm)', background: 'transparent',
              color: 'var(--text3)', fontSize: 13, cursor: 'pointer', textAlign: 'left',
              display: 'flex', alignItems: 'center', gap: 6, fontFamily: 'inherit',
            }}
          >
            <IconPlus size={13} /> Add task
          </button>
        )}
      </div>
    </div>
  );
}

// ─── Mini Calendar ────────────────────────────────────────────────────────
function MiniCalendar({ viewDate, onPrev, onNext, onDay }) {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const offset = (firstDay.getDay() + 6) % 7;
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  const cells = [
    ...Array(offset).fill(null),
    ...Array.from({ length: lastDay.getDate() }, (_, i) => new Date(year, month, i + 1)),
  ];
  while (cells.length % 7) cells.push(null);

  const monthLabel = viewDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  return (
    <div style={{ padding: '14px 14px 16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: 'var(--sb-text)', opacity: 0.8 }}>{monthLabel}</span>
        <div style={{ display: 'flex', gap: 2 }}>
          <CalNavBtn onClick={onPrev}><IconChevL size={13}/></CalNavBtn>
          <CalNavBtn onClick={onNext}><IconChevR size={13}/></CalNavBtn>
        </div>
      </div>

      {/* Day headers */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2, marginBottom: 4 }}>
        {CAL_DAYS.map(d => (
          <div key={d} style={{ textAlign: 'center', fontSize: 10, color: 'var(--sb-muted)', fontWeight: 600, padding: '2px 0' }}>{d}</div>
        ))}
      </div>

      {/* Days */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 3 }}>
        {cells.map((date, i) => {
          if (!date) return <div key={i} />;
          const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
          const heat = heatmap[ds];
          const isToday = ds === todayStr;
          const hasData = heat !== null && heat !== undefined;

          let dotColor = 'transparent';
          if (hasData) {
            if (heat === 0) dotColor = '#3a3632';
            else if (heat < 0.6) dotColor = 'rgba(232,107,58,0.5)';
            else if (heat < 0.9) dotColor = 'rgba(232,107,58,0.8)';
            else dotColor = 'var(--accent)';
          }

          return (
            <button
              key={ds}
              onClick={() => onDay(ds)}
              style={{
                aspectRatio: '1', display: 'flex', flexDirection: 'column', alignItems: 'center',
                justifyContent: 'center', borderRadius: 6, border: isToday ? '1.5px solid var(--accent)' : '1.5px solid transparent',
                background: 'transparent', cursor: 'pointer',
                fontSize: 11, fontWeight: isToday ? 700 : 400,
                color: isToday ? 'var(--accent)' : 'var(--sb-text)', opacity: isToday ? 1 : 0.75,
                gap: 2,
              }}
            >
              {date.getDate()}
              {hasData && <div style={{ width: 4, height: 4, borderRadius: '50%', background: dotColor, flexShrink: 0 }} />}
            </button>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{ display: 'flex', gap: 12, marginTop: 10, paddingLeft: 2 }}>
        {[['rgba(232,107,58,0.4)', '33%'], ['rgba(232,107,58,0.8)', '67%'], ['var(--accent)', '100%']].map(([c,l]) => (
          <div key={l} style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 10, color: 'var(--sb-muted)' }}>
            <div style={{ width: 6, height: 6, borderRadius: '50%', background: c }} />{l}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── App Root ─────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);
  const [activePage, setActivePage] = useState('today');
  const [tasks, setTasks] = useState(TASKS_INIT);

  // Apply dark mode
  useEffect(() => {
    document.documentElement.classList.toggle('dark', tweaks.dark);
  }, [tweaks.dark]);

  // Tweak protocol
  useEffect(() => {
    function handleMsg(e) {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    }
    window.addEventListener('message', handleMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handleMsg);
  }, []);

  function onTweakChange(key, value) {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  }

  function handleToggle(id) {
    setTasks(prev => {
      const next = {};
      for (const [col, list] of Object.entries(prev)) {
        next[col] = list.map(t => t.id === id ? { ...t, done: !t.done } : t);
      }
      return next;
    });
  }

  function handleDelete(id) {
    setTasks(prev => {
      const next = {};
      for (const [col, list] of Object.entries(prev)) {
        next[col] = list.filter(t => t.id !== id);
      }
      return next;
    });
  }

  function handleAdd(colKey, title) {
    const newId = Date.now();
    setTasks(prev => ({ ...prev, [colKey]: [...prev[colKey], { id: newId, title, tags: [], done: false }] }));
  }

  const density = tweaks.density;
  const colPad = density === 'compact' ? 16 : density === 'spacious' ? 28 : 20;

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: 'var(--bg)' }}>
      <Sidebar activePage={activePage} onNav={setActivePage} dark={tweaks.dark} onToggleDark={() => onTweakChange('dark', !tweaks.dark)} />

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0, overflow: 'hidden' }}>
        <Header tasks={tasks} />

        {tweaks.colStyle === 'focus' ? (
          <div style={{ flex: 1, overflow: 'hidden' }}>
            <FocusLayout tasks={tasks} onToggle={handleToggle} onDelete={handleDelete} onAdd={handleAdd} density={density} />
          </div>
        ) : (
          <main style={{ flex: 1, overflowY: 'auto', padding: colPad }}>
            <div style={{ display: 'flex', gap: 14, marginBottom: 24, height: 'calc(100vh - 200px)', minHeight: 400 }}>
              {COLS.map(col => (
                <TaskColumn key={col.key} col={col} tasks={tasks} onToggle={handleToggle} onDelete={handleDelete} onAdd={handleAdd} density={density} />
              ))}
            </div>
            <NotesSection />
          </main>
        )}
      </div>

      {showTweaks && <TweaksPanel tweaks={tweaks} onChange={onTweakChange} onClose={() => setShowTweaks(false)} />}
    </div>
  );
}
